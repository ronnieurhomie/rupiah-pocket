<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fafbf9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rupiah Pocket">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Quick rupiah conversions for travel. Choose up to three currencies, save daily rates, and calculate offline.">
  <title>Rupiah Pocket</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="calculator">
    <header class="app-header"><h1>Rupiah Pocket</h1></header>
    <div class="reader">
      <section id="results" class="results" aria-label="Conversions"></section>
      <section class="amount" aria-label="Rupiah amount">
        <div class="amount-entry">
          <label for="amt"><span>IDR</span><span class="amount-unit">× 1,000</span></label>
          <input id="amt" aria-describedby="full" readonly inputmode="none" type="text" placeholder="0" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
        </div>
        <div class="amount-tools">
          <div id="full">Enter an amount</div>
          <button id="native" aria-label="Phone keyboard" title="Phone keyboard"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M5 9h2m2 0h2m2 0h2m2 0h2M5 12h2m2 0h2m2 0h2m2 0h2M7 16h10"/></svg></button>
          <button id="clear" aria-label="Clear amount">Clear</button>
        </div>
      </section>
    </div>
    <section class="keypad" aria-label="Number keypad">
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
      <button data-key="." aria-label="Decimal point">.</button><button data-key="0">0</button>
      <button data-key="Backspace" aria-label="Backspace"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9L2 12zM12 9l6 6m0-6-6 6"/></svg></button>
    </section>
    <footer class="rate-note">
      <div id="rate-status" role="status">Loading daily rates…</div>
      <div><a id="rate-source" href="https://www.exchangerate-api.com" target="_blank" rel="noopener noreferrer">Rates By Exchange Rate API</a><span> · Excludes fees</span></div>
    </footer>
  </main>
  <dialog id="currency-dialog" aria-labelledby="currency-title">
    <form method="dialog">
      <div class="dialog-heading">
        <button id="currency-cancel" value="cancel">Cancel</button>
        <h2 id="currency-title">Currencies</h2>
        <button id="currency-save" value="save">Done</button>
      </div>
      <div class="picker-summary"><p id="currency-hint">Choose 1–3 currencies.</p><span id="currency-count" role="status"></span></div>
      <input id="currency-search" type="search" aria-label="Search currencies" placeholder="Search currencies" autocomplete="off" spellcheck="false">
      <div id="currency-options" class="currency-options" role="group" aria-label="Available currencies" aria-describedby="currency-hint"></div>
    </form>
  </dialog>
</body>
</html>
